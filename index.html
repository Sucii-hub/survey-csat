<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Kepuasan Pelanggan (CSAT)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        header p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        /* Pilihan Emoji Interaktif */
        .rating-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .rating-options input[type="radio"] {
            display: none;
        }

        .rating-label {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: block;
        }

        .rating-label:hover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .rating-options input[type="radio"]:checked + .rating-label {
            border-color: var(--primary);
            background: #e0e7ff;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 4px;
        }

        .lbl-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
        }

        button.btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background: var(--primary-dark);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⭐ Survey Kepuasan Pelanggan (CSAT)</h1>
            <p>Bantu kami meningkatkan kualitas layanan dengan memberikan masukan Anda</p>
        </header>

        <!-- FORM TERHUBUNG KE FORMSPREE SUCI -->
        <form action="https://formspree.io/f/mqerrdvw" method="POST">

            <div class="form-group">
                <label for="nama">Nama Pelanggan / Inisial:</label>
                <input type="text" id="nama" name="Nama_Pelanggan" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="form-group">
                <label>Bagaimana pengalaman layanan kami secara keseluruhan?</label>
                <div class="rating-options">
                    <div>
                        <input type="radio" id="r1" name="Tingkat_Kepuasan" value="😍 Sangat Puas (100%)" required>
                        <label for="r1" class="rating-label">
                            <span class="emoji">😍</span>
                            <span class="lbl-text">Sangat Puas</span>
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="r2" name="Tingkat_Kepuasan" value="😊 Puas (75%)">
                        <label for="r2" class="rating-label">
                            <span class="emoji">😊</span>
                            <span class="lbl-text">Puas</span>
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="r3" name="Tingkat_Kepuasan" value="😐 Cukup (50%)">
                        <label for="r3" class="rating-label">
                            <span class="emoji">😐</span>
                            <span class="lbl-text">Cukup</span>
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="r4" name="Tingkat_Kepuasan" value="😞 Kecewa (25%)">
                        <label for="r4" class="rating-label">
                            <span class="emoji">😞</span>
                            <span class="lbl-text">Kecewa</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="saran">Kritik, Saran, atau Masukan:</label>
                <textarea id="saran" name="Kritik_dan_Saran" rows="4" placeholder="Tuliskan masukan Anda untuk perbaikan layanan kami..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Feedback 📩</button>
        </form>

        <footer>
            <p>&copy; 2026 Sucii • Portofolio Layanan Pelanggan (CRM)</p>
        </footer>
    </div>

</body>
</html>
